<!-- Interactive Input Engine Micro-Script -->
<script>
    (() => {
      const display = document.getElementById('cad-display');
      let currentValue = "Ø 48.50";

      const updateView = () => {
        if (!display) return;
        display.textContent = currentValue || "0";
      };

      document.querySelectorAll('.cad-key').forEach(button => {
        button.addEventListener('click', (e) => {
          const key = button.getAttribute('data-key');
          const action = button.getAttribute('data-action');

          if (key) {
            if (currentValue === "0" && key !== ".") {
              currentValue = key;
            } else {
              currentValue += key;
            }
            updateView();
          } else if (action === 'backspace') {
            if (currentValue.length > 0) {
              // Strip trailing spaces or compound symbols gracefully
              if (currentValue.endsWith("Ø ") || currentValue.endsWith("R ")) {
                currentValue = currentValue.slice(0, -2);
              } else {
                currentValue = currentValue.slice(0, -1);
              }
              updateView();
            }
          }
        });
      });

      const cancelBtn = document.getElementById('btn-cancel');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          currentValue = "Ø 48.50";
          updateView();
        });
      }

      const confirmBtn = document.getElementById('btn-confirm');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          // Visual feedback click
          confirmBtn.classList.add('opacity-80');
          setTimeout(() => confirmBtn.classList.remove('opacity-80'), 150);
        });
      }
    })();
  </script>
